# MNPBEM jobs on the lab PC (Windows 11, 32 GB), registered as a GitHub self-hosted runner with the label 'lab32'.
# Each line of isi/local_runner/jobs.txt ("job spec output.csv") runs with the locally installed, licensed MATLAB,
# one job after another (MATLAB uses all cores); jobs whose output already exists in isi/results/bem_extra/ are skipped.
# Every finished job is committed and pushed immediately, so an interruption loses at most the running job.
# Trigger: push a change to isi/local_runner/jobs.txt, or run manually (Actions tab -> bem-local -> Run workflow).
# Only pushes by the repository's own collaborators and manual runs start it (no pull_request trigger).
name: bem-local

on:
  workflow_dispatch:
  push:
    paths:
      - 'isi/local_runner/jobs.txt'

permissions:
  contents: write

concurrency:
  group: bem-local

jobs:
  run:
    runs-on: [self-hosted, Windows, lab32]
    timeout-minutes: 4320
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: find MATLAB
        run: |
          $m = Get-Command matlab -ErrorAction SilentlyContinue
          if (-not $m) {
            $c = Get-ChildItem "C:\Program Files\MATLAB\*\bin\matlab.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
            if (-not $c) { Write-Error "MATLAB not found on this PC"; exit 1 }
            $p = $c.FullName
          } else { $p = $m.Source }
          Write-Host "MATLAB: $p"
          "MATLAB_EXE=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: fetch MNPBEM17 (GPL-2.0)
        run: |
          $ErrorActionPreference = 'Continue'
          git clone -q --depth 1 https://github.com/Nikolaos-Matthaiakakis/MNPBEM.git isi/bem/MNPBEM17
          if (-not (Test-Path isi/bem/MNPBEM17/Material)) { Write-Error "MNPBEM clone failed"; exit 1 }
      - name: run jobs
        run: |
          $ErrorActionPreference = 'Continue'      # git and MATLAB write progress to stderr; failures are checked explicitly
          git config user.name "lab-pc runner"
          git config user.email "actions@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path out, isi/results/bem_extra | Out-Null
          foreach ($l in Get-Content isi/local_runner/jobs.txt) {
            if (-not $l.Trim() -or $l.StartsWith('#')) { continue }
            $job, $spec, $outf = -split $l
            if (Test-Path "isi/results/bem_extra/$outf") { Write-Host "skip $job $spec (done)"; continue }
            Write-Host "=== $job $spec ==="
            $cmd = "addpath(genpath('isi/bem/MNPBEM17')); addpath('isi/bem/extra'); tic; job_$job('$spec', 'out'); fprintf('elapsed %.1f min\n', toc/60)"
            & $env:MATLAB_EXE -batch $cmd
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "out/$outf")) { Write-Warning "$job $spec failed"; continue }
            Copy-Item "out/$outf" "isi/results/bem_extra/$outf"
            git add "isi/results/bem_extra/$outf"
            git commit -m "lab PC: $job $spec"
            for ($i = 1; $i -le 4; $i++) {
              git pull --rebase --autostash origin $env:GITHUB_REF_NAME
              git push origin "HEAD:$env:GITHUB_REF_NAME"
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (5 * $i)
            }
          }
          exit 0
